name: karigaar_app
description: "Karigaar - Hyperlocal On-demand Skilled Artisan & Home Services Marketplace"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Declarative Routing
  go_router: ^14.6.2

  # Typography & Design System Icons
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Authentication & Form Inputs
  pinput: ^5.0.0

  # Intent Dispatches (Path A Direct Call & WhatsApp)
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  path_provider_android: 2.2.17

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
    - assets/reference_ui/
