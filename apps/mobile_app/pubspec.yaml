name: karigaar_app
description: "Karigaar - Hyperlocal On-demand Skilled Artisan & Home Services Marketplace"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Declarative Routing
  go_router: ^14.6.2

  # Firebase Ecosystem (Project: karigaar-ba812)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3

  # Typography & Design System Icons
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.12
  intl: ^0.19.0
  cached_network_image: ^3.4.1

  # Authentication & Form Inputs
  pinput: ^5.0.0

  # Networking & HTTP
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Local Persistence & Secure Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Geolocation & Mapping
  geolocator: ^13.0.2
  latlong2: ^0.9.1

  # Scoping Media (Photo & 15s Audio Notes)
  image_picker: ^1.1.2
  audioplayers: ^6.1.0
  record: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
    - assets/reference_ui/
